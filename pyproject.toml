[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-llmhub"
version = "0.1.0"
description = "Git for AI conversations - mirror your AI chats into a version-controlled Obsidian knowledge vault"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
obsidian-llmhub = "obsidianllmhub.cli:main"

[project.urls]
Homepage = "https://github.com/rightson/Obsidian-LLMHub"

[tool.setuptools.packages.find]
where = ["src"]
